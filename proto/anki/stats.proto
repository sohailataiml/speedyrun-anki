syntax = "proto3";

option java_multiple_files = true;

package anki.stats;

import "anki/generic.proto";
import "anki/cards.proto";

service StatsService {
  rpc CardStats(cards.CardId) returns (CardStatsResponse);
  rpc GetReviewLogs(cards.CardId) returns (ReviewLogs);
  rpc Graphs(GraphsRequest) returns (GraphsResponse);
  rpc GetGraphPreferences(generic.Empty) returns (GraphPreferences);
  rpc SetGraphPreferences(GraphPreferences) returns (generic.Empty);
  rpc MasteryQuery(MasteryQueryRequest) returns (MasteryQueryResponse);
  rpc GiveUpGate(GiveUpGateRequest) returns (GiveUpGateResponse);
  rpc PerformanceQuery(PerformanceQueryRequest) returns (PerformanceQueryResponse);
  rpc ReadinessQuery(ReadinessQueryRequest) returns (ReadinessQueryResponse);
}

// Implicitly includes any of the above methods that are not listed in the
// backend service.
service BackendStatsService {}

message ReviewLogs {
  repeated CardStatsResponse.StatsRevlogEntry entries = 1;
}

message CardStatsResponse {
  message StatsRevlogEntry {
    int64 time = 1;
    RevlogEntry.ReviewKind review_kind = 2;
    uint32 button_chosen = 3;
    // seconds
    uint32 interval = 4;
    // per mill
    uint32 ease = 5;
    float taken_secs = 6;
    optional cards.FsrsMemoryState memory_state = 7;
    // seconds
    uint32 last_interval = 8;
  }
  repeated StatsRevlogEntry revlog = 1;
  int64 card_id = 2;
  int64 note_id = 3;
  string deck = 4;
  // Unix timestamps
  int64 added = 5;
  optional int64 first_review = 6;
  optional int64 latest_review = 7;
  optional int64 due_date = 8;
  optional int32 due_position = 9;
  // days
  uint32 interval = 10;
  // per mill
  uint32 ease = 11;
  uint32 reviews = 12;
  uint32 lapses = 13;
  float average_secs = 14;
  float total_secs = 15;
  string card_type = 16;
  string notetype = 17;
  optional cards.FsrsMemoryState memory_state = 18;
  // not set if due date/state not available
  optional float fsrs_retrievability = 19;
  string custom_data = 20;
  string preset = 21;
  optional string original_deck = 22;
  optional float desired_retention = 23;
  repeated float fsrs_params = 24;
}

// Speedrun addition: per-topic mastery/recall for the three-score dashboard.
// A "topic" is a `topic::<name>` tag on a note; see rslib/src/stats/mastery.rs.
message MasteryQueryRequest {
  // Topic names without the "topic::" prefix.
  repeated string topics = 1;
}

message MasteryQueryResponse {
  repeated TopicMastery topics = 1;
}

message TopicMastery {
  string topic = 1;
  // Mean current FSRS retrievability across cards in this topic that have
  // been introduced (i.e. have a memory state). 0 if none have.
  float mastery = 2;
  // Proportion of graded reviews in this topic rated higher than "Again".
  // 0 if none have been graded.
  float average_recall = 3;
  uint32 cards_with_reviews = 4;
  uint32 cards_total = 5;

  // Speedrun addition (Brainlift v3): latency statistics. See
  // rslib/src/stats/latency_monitor.rs and
  // speedrun/docs/latency-volatility.md.
  //
  // Coefficient of variation (SD / mean) of this topic's graded-review
  // latencies. `optional` is load-bearing, not decoration: fewer than two
  // reviews means there is no dispersion to measure, and a defaulted 0.0
  // would sit *below* the rote-pattern threshold — every barely-studied
  // topic would be flagged as spacebar-reflex. Absent means "not enough
  // data", which is a different claim from "measured as zero".
  optional float latency_volatility = 6;
  // Reviews faster than the fast/slow threshold (recognition) vs slower
  // (analytical) — Kahneman's System 1 / System 2.
  uint32 system1_review_count = 7;
  uint32 system2_review_count = 8;
  // Reviews answered faster than this topic's cards could physically be
  // read. Distinct from merely being fast.
  uint32 below_min_reading_time_count = 9;
  uint32 graded_review_count = 10;
}

// Speedrun addition: the give-up rule (PRD §5) — refuses to return score
// inputs at all when the collection doesn't have enough data yet, rather
// than letting a caller compute a low-confidence score. Sits in front of
// the Performance model; see rslib/src/stats/give_up_gate.rs.
message GiveUpGateRequest {
  // Same topic set as MasteryQueryRequest.
  repeated string topics = 1;
}

message GiveUpGateResponse {
  oneof result {
    GiveUpGateData data = 1;
    InsufficientData insufficient = 2;
  }
}

message GiveUpGateData {
  uint32 total_graded_reviews = 1;
  // 0.0-1.0: proportion of the requested topics with at least one graded
  // review.
  float topic_coverage = 2;
  repeated TopicMastery topics = 3;
}

message InsufficientData {
  uint32 total_graded_reviews = 1;
  float topic_coverage = 2;
  uint32 reviews_required = 3;
  float coverage_required = 4;

  // Speedrun addition (Brainlift v3 POV 2): *why* the app is refusing.
  //
  // Repeated, not a single enum, because more than one rule can fail at
  // once and collapsing them would let the UI report a fixable problem
  // while hiding a second one. A client that shows only the first reason
  // would have the student chase review count while the real blocker is
  // that they are pattern-matching.
  enum Reason {
    REASON_UNSPECIFIED = 0;
    NOT_ENOUGH_REVIEWS = 1;
    NOT_ENOUGH_COVERAGE = 2;
    // Brainlift v3 §7's "Insufficient Data: Rote Pattern Detected".
    ROTE_PATTERN_DETECTED = 3;
  }
  repeated Reason reasons = 5;

  // Populated when ROTE_PATTERN_DETECTED is present: the share of topics
  // whose latency volatility fell below the rote threshold, and the share
  // at which the rule trips.
  float rote_pattern_topic_fraction = 6;
  float rote_pattern_fraction_allowed = 7;
  // The coefficient-of-variation threshold a topic must clear. Surfaced
  // so a client never has to hardcode it — see latency-volatility.md on
  // why this number is an interpretation of an underspecified brainlift
  // threshold rather than a quoted constant.
  float rote_pattern_cv_threshold = 8;
}

// Speedrun addition: predicts accuracy on held-back exam-style questions
// from topic mastery, question difficulty, timing, and coverage (PRD
// §10.2). Runs the give-up gate first; see rslib/src/stats/performance_model.rs.
message PerformanceQueryRequest {
  repeated string topics = 1;
  // Caller-supplied signal from recent exam-style question attempts.
  // 0.0-1.0, higher = harder.
  float average_difficulty = 2;
  float average_timing_seconds = 3;
}

message PerformanceQueryResponse {
  oneof result {
    PerformanceData data = 1;
    InsufficientData insufficient = 2;
  }
}

message PerformanceData {
  // 0.0-1.0: predicted probability of answering a new exam-style question
  // correctly.
  float predicted_accuracy = 1;
  GiveUpGateData inputs = 2;

  // Speedrun addition (Brainlift v3 POV 3): accuracy on AI-generated
  // "jitter" cards — context-shifted variants that test far transfer
  // rather than recall of the original card. Reserved here so Phase 5 of
  // the pivot plan needs no second Android AAR cross-compile.
  //
  // Optional for the same reason as latency_volatility: jitter cards only
  // appear every Nth review of reasoning-heavy cards, so on a young
  // collection there are legitimately none, and a defaulted 0.0 accuracy
  // would read as "the student gets every transfer question wrong".
  optional float jitter_accuracy = 3;
  uint32 jitter_attempts = 4;
}

// Speedrun addition: maps the Performance prediction onto the exam's real
// scale (PRD §5/§6/§10.3), with a range and a confidence label, never a
// single number. Runs PerformanceQuery first; see
// rslib/src/stats/readiness_mapper.rs for the method and its stated
// limitations.
message ReadinessQueryRequest {
  repeated string topics = 1;
  float average_difficulty = 2;
  float average_timing_seconds = 3;
}

message ReadinessQueryResponse {
  oneof result {
    ReadinessData data = 1;
    InsufficientData insufficient = 2;
  }
}

message ReadinessData {
  // MCAT scale, 472-528.
  uint32 projected_score = 1;
  uint32 range_low = 2;
  uint32 range_high = 3;
  enum Confidence {
    LOW = 0;
    MEDIUM = 1;
    HIGH = 2;
  }
  Confidence confidence = 4;
  PerformanceData inputs = 5;

  // Speedrun addition (Brainlift v3 §8): Readiness is a composite of
  // Memory and Performance "weighted by Latency Volatility". Reserved
  // here so Phase 6 needs no second AAR cross-compile.
  //
  // The multiplier actually applied, surfaced rather than folded silently
  // into projected_score: a score that has been penalised should be able
  // to say so on screen. 1.0 means no penalty was applied.
  float latency_volatility_weight = 6;
  // Reviews across the scored topics answered faster than the card could
  // be read — what the penalty is charged for.
  uint32 spacebar_reflex_reviews = 7;
}

message GraphsRequest {
  string search = 1;
  uint32 days = 2;
}

message GraphsResponse {
  message Added {
    map<int32, uint32> added = 1;
  }
  message Intervals {
    map<uint32, uint32> intervals = 1;
  }
  message Eases {
    map<uint32, uint32> eases = 1;
    float average = 2;
  }
  message Retrievability {
    map<uint32, uint32> retrievability = 1;
    float average = 2;
    float sum_by_card = 3;
    float sum_by_note = 4;
  }
  message FutureDue {
    map<int32, uint32> future_due = 1;
    bool have_backlog = 2;
    uint32 daily_load = 3;
  }
  message Today {
    uint32 answer_count = 1;
    uint32 answer_millis = 2;
    uint32 correct_count = 3;
    uint32 mature_correct = 4;
    uint32 mature_count = 5;
    uint32 learn_count = 6;
    uint32 review_count = 7;
    uint32 relearn_count = 8;
    uint32 early_review_count = 9;
  }
  // each bucket is a 24 element vec
  message Hours {
    message Hour {
      uint32 total = 1;
      uint32 correct = 2;
    }
    repeated Hour one_month = 1;
    repeated Hour three_months = 2;
    repeated Hour one_year = 3;
    repeated Hour all_time = 4;
  }
  message ReviewCountsAndTimes {
    message Reviews {
      uint32 learn = 1;
      uint32 relearn = 2;
      uint32 young = 3;
      uint32 mature = 4;
      uint32 filtered = 5;
    }
    map<int32, Reviews> count = 1;
    map<int32, Reviews> time = 2;
  }
  // 4 element vecs for buttons 1-4
  message Buttons {
    message ButtonCounts {
      repeated uint32 learning = 1;
      repeated uint32 young = 2;
      repeated uint32 mature = 3;
    }
    ButtonCounts one_month = 1;
    ButtonCounts three_months = 2;
    ButtonCounts one_year = 3;
    ButtonCounts all_time = 4;
  }
  message CardCounts {
    message Counts {
      uint32 newCards = 1;
      uint32 learn = 2;
      uint32 relearn = 3;
      uint32 young = 4;
      uint32 mature = 5;
      uint32 suspended = 6;
      uint32 buried = 7;
    }
    // Buried/suspended cards are included in counts; suspended/buried counts
    // are 0.
    Counts including_inactive = 1;
    // Buried/suspended cards are counted separately.
    Counts excluding_inactive = 2;
  }
  message TrueRetentionStats {
    message TrueRetention {
      uint32 young_passed = 1;
      uint32 young_failed = 2;
      uint32 mature_passed = 3;
      uint32 mature_failed = 4;
    }

    TrueRetention today = 1;
    TrueRetention yesterday = 2;
    TrueRetention week = 3;
    TrueRetention month = 4;
    TrueRetention year = 5;
    TrueRetention all_time = 6;
  }

  Buttons buttons = 1;
  CardCounts card_counts = 2;
  Hours hours = 3;
  Today today = 4;
  Eases eases = 5;
  Eases difficulty = 11;
  Intervals intervals = 6;
  FutureDue future_due = 7;
  Added added = 8;
  ReviewCountsAndTimes reviews = 9;
  uint32 rollover_hour = 10;
  Retrievability retrievability = 12;
  bool fsrs = 13;
  Intervals stability = 14;
  TrueRetentionStats true_retention = 15;
}

message GraphPreferences {
  enum Weekday {
    SUNDAY = 0;
    MONDAY = 1;
    FRIDAY = 5;
    SATURDAY = 6;
  }
  Weekday calendar_first_day_of_week = 1;
  bool card_counts_separate_inactive = 2;
  bool browser_links_supported = 3;
  bool future_due_show_backlog = 4;
}

message RevlogEntry {
  enum ReviewKind {
    LEARNING = 0;
    REVIEW = 1;
    RELEARNING = 2;
    FILTERED = 3;
    MANUAL = 4;
    RESCHEDULED = 5;
  }
  int64 id = 1;
  int64 cid = 2;
  int32 usn = 3;
  uint32 button_chosen = 4;
  int32 interval = 5;
  int32 last_interval = 6;
  uint32 ease_factor = 7;
  uint32 taken_millis = 8;
  ReviewKind review_kind = 9;
}

message CardEntry {
  int64 id = 1;
  int64 note_id = 2;
  int64 deck_id = 3;
}

message DeckEntry {
  int64 id = 1;
  int64 parent_id = 2;
  int64 preset_id = 3;
}

message Dataset {
  repeated RevlogEntry revlogs = 1;
  repeated CardEntry cards = 2;
  repeated DeckEntry decks = 3;
  int64 next_day_at = 4;
}
